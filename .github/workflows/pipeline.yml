name: Multi-Stage Deployment pipeline

# TRIGGER CONTROL: run this pipeline whenever anyone pushes code to dev or main
on:
  push:
    branches: [ dev, staging, main ]

jobs:
  # PHASE-ONE: VERIFICATIOIN & TESTING (Runs automaticaally on github runners)
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Setup Node runtime with caching 
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Run Unit Test Pyramid Layer 
        run: npm test  

  # PHASE-TWO: AUTOMATED DEPLOYMENTS (triggers only if test passed successfully)
  deploy-to-aws:
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


      # Securely log into AWS, package the app and launch it live!
      - name: Execute Remote SSH Deployment Via Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.AWS_SERVER_IP}}
          username: ${{secrets.AWS_USERNAME}}
          key: ${{secrets.AWS_SSH_KEY}}
          sscript: |
            echo "--- Standing inside Live AWS Server ---"
            
            # 1. Ensure our workspaces exist cleanly
            mkdir -p ~/app/src
            cd ~/app

            # 2. Clear out old files safely
            rm -f package.json Dockerfile src/app.js

            # 3. Re-inject our architectural layers cleanly
            cat << 'EOF' > package.json
            {
              "name": "my-devops-project",
              "version": "1.0.0",
              "description": "Multi-stage pipeline backend tracker",
              "main": "src/app.js",
              "scripts": {
                "start": "node src/app.js",
                "test": "echo \"Running feature unit tests...\" && exit 0"
              },
              "dependencies": {}
            }
            EOF

            cat << 'EOF' > Dockerfile
            FROM node:20-alpine AS builder
            WORKDIR /usr/src/app
            COPY package*.json ./
            RUN npm install
            COPY src/ ./src

            FROM node:20-alpine AS runtime
            ENV NODE_ENV=production
            WORKDIR /app
            COPY --from=builder /usr/src/app/src ./src
            EXPOSE 3000
            CMD ["node", "src/app.js"]
            EOF

            cat << 'EOF' > src/app.js
            const http = require('http');
            const PORT = process.env.PORT || 3000;
            const ENV_NAME = process.env.NODE_ENV || 'Development Sandbox';

            const server = http.createServer((req, res) => {
              if (req.url === '/health') {
                res.writeHead(200, { 'Content-Type': 'application/json' });
                return res.end(JSON.stringify({ status: 'UP', environment: ENV_NAME }));
              }
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end(`Welcome to the ${ENV_NAME} Environment!\nDeployment is 100% SUCCESSFUL!\n`);
            });

            server.listen(PORT, () => {
              console.log(`Server running securely on port ${PORT}`);
            });
            EOF

            echo "--- Executing Automated Docker Swaps ---"
            # 4. Cycle out the old running container
            docker stop my-feature-app || true
            docker rm my-feature-app || true

            # 5. Build our highly optimized container image from scratch
            docker build -t devops-app:latest .

            # 6. Push the new build live to web port 80
            docker run -d --name my-feature-app -p 80:3000 -e NODE_ENV="Development Feature Phase" devops-app:latest
            
            echo "--- Automation Run Completed Successfully! ---"

